# 本地开发：独立完整的 Compose 文件（不继承 docker-compose.yml），与线上文件互不依赖。
#   docker compose -f docker-compose.local.yml up -d --build
# 与线上的区别：GenshinQuiz / MoeLink 前端使用 Vite 热更新（源码挂载），其余服务保持一致。
# 变量同样从根目录 .env 读取（./setup.sh --env 可生成）。
volumes:
  postgres_data:
  go_mods:
  go_tools:
  go_bin:
  vite_deps:
  node_modules_cache:
  maj_node_modules_cache:
  genshin_node_modules_cache:
  gateway_data:
  auth_keys:
  avatar_data:
  moelink_node_modules_cache:
  stock_worker_node_modules_cache:

services:
  # React (Vite dev server, hot reload)
  genshinquiz-frontend:
    container_name: genshinquiz-frontend
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./repos/frontend:/app
      - genshin_node_modules_cache:/app/node_modules
      - vite_deps:/app/node_modules/.vite
    environment:
      VITE_API_URL: http://genshinquiz-backend:8080
      AUTH_API_URL: http://auth-service:8081
      CHOKIDAR_USEPOLLING: "true"
    command: /bin/sh -c "bun install && bun run dev:docker"
    depends_on:
      genshinquiz-backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 30s
    restart: unless-stopped

  # Go Backend API
  genshinquiz-backend:
    container_name: genshinquiz-backend
    image: golang:1.27
    restart: unless-stopped
    ports:
      - "8080:8080"
    working_dir: /app
    environment:
      GOBIN: /app/bin
      # 只提供 quiz 路由；/auth/* 由独立 auth-service 处理
      SERVICE_MODE: quiz
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/genshinquiz?sslmode=disable"
      # token 由 auth-service 用 ES256 私钥签发；这里只通过 JWKS 获取公钥校验，不持有任何签名密钥
      AUTH_JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:3000}
      SENTRY_DSN: ${GO_SENTRY_DSN:-}
      RESEND_KEY: ${RESEND_KEY:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_CONTAINER_NAME: ${AZURE_CONTAINER_NAME:-genshin-quiz}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-}
      OAUTH_COOKIE_DOMAIN: ${OAUTH_COOKIE_DOMAIN:-}
      OAUTH_ALLOWED_REDIRECT_ORIGINS: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:-https://moelink.site,https://www.moelink.site,https://quiz.moelink.site,http://localhost:3000,http://localhost:5173,http://localhost:8000,https://api.moelink.site}
    volumes:
      - ./repos/backend:/app
      - go_mods:/go/pkg/mod
      - go_bin:/app/bin
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /usr/local/bin/task ]; then
          curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
        fi
        if ! command -v psql &> /dev/null; then
          apt update && apt install -y postgresql-client && apt clean
        fi
        task init-env
        if [ ! -f /app/bin/goose ]; then
          go install github.com/pressly/goose/v3/cmd/goose@latest
        fi
        task db-migration-up || { echo "Migration failed"; exit 1; }
        task run-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 40s

  # 独立身份服务：只提供 /auth/*，与 quiz 业务进程分离
  auth-service:
    container_name: auth-service
    image: golang:1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    working_dir: /app
    environment:
      PORT: "8081"
      SERVICE_MODE: auth
      AVATAR_DIR: /data/avatars
      # ES256 签名私钥（首次启动自动生成）；只有 auth-service 持有，请持久化并妥善备份
      JWT_KEY_FILE: /data/keys/jwt-es256.pem
      # 会话 Cookie 的共享域名：线上设为 .moelink.site，使各子站共用登录；本地留空
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      # 站外应用（不在 moelink.site 下的项目）单点登录的登记表，JSON 数组：
      # [{"id":"app","name":"显示名","redirect_uris":["https://app.example/callback"]}]
      SSO_CLIENTS: ${SSO_CLIENTS:-}
      DATABASE_URL: "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/genshinquiz?sslmode=disable"
      # 仅用于 OAuth state / 绑定凭证的 HMAC；不再用于登录 token（登录 token 为 ES256）
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      APP_DOMAIN: ${APP_DOMAIN:-http://localhost:3000}
      # 首次部署引导：只有系统里没有任何管理员时才按邮箱创建/提权
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-}
      BOOTSTRAP_ADMIN_RESET_PASSWORD: ${BOOTSTRAP_ADMIN_RESET_PASSWORD:-false}
      SENTRY_DSN: ${GO_SENTRY_DSN:-}
      RESEND_KEY: ${RESEND_KEY:-}
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:-}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY:-}
      AZURE_CONTAINER_NAME: ${AZURE_CONTAINER_NAME:-genshin-quiz}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-}
      OAUTH_COOKIE_DOMAIN: ${OAUTH_COOKIE_DOMAIN:-}
      OAUTH_ALLOWED_REDIRECT_ORIGINS: ${OAUTH_ALLOWED_REDIRECT_ORIGINS:-https://moelink.site,https://www.moelink.site,https://quiz.moelink.site,http://localhost:3000,http://localhost:5173,http://localhost:8000,https://api.moelink.site}
    volumes:
      - ./repos/backend:/app
      - go_mods:/go/pkg/mod
      - go_bin:/app/bin
      - avatar_data:/data/avatars
      - auth_keys:/data/keys
    depends_on:
      # 第一阶段仍共用 genshinquiz 库；等 quiz 完成 goose 迁移后再启动
      genshinquiz-backend:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        go run ./cmd/auth
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 60s

  # MoeLink (Vite dev server, hot reload)
  moe-link:
    container_name: moe-link
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./repos/MoeLink:/app
      - moelink_node_modules_cache:/app/node_modules
    environment:
      VITE_API_URL: http://node-api:8020
      # 仅在根 .env 有值时注入；未设置则让 Vite 读取 repos/MoeLink/.env.local
      VITE_PRIMEUI_LICENSE_KEY:
      VITE_BUILD_VERSION: ${VITE_BUILD_VERSION:-}
      CHOKIDAR_USEPOLLING: "true"
    command: /bin/sh -c "bun install && bun ./node_modules/vite/bin/vite.js"
    depends_on:
      - node-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 60s
    restart: unless-stopped

  # Node.js API Server
  node-api:
    container_name: node-api
    image: node:22-alpine
    working_dir: /app
    ports:
      - "8020:8020"
    environment:
      # 端口必须显式声明：仓库内 .env 被 gitignore，NAS 全新克隆后不存在，
      # 缺省会回退到 3000 导致端口映射与健康检查全部失效
      PORT: "8020"
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # token 由 auth-service 签发；node-api 只通过 JWKS 获取公钥校验
      AUTH_JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      # 统一用户系统现在由独立 auth-service 提供
      GO_BACKEND_URL: http://auth-service:8081
      # 小屋编辑权限：仅这些 user_id（逗号分隔）可写，本地默认 6
      MIAO_OWNER_EMAILS: "${MIAO_OWNER_EMAILS:-}"
      SENTRY_DSN: ${NODE_SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    volumes:
      - ./repos/node-api:/app
      - node_modules_cache:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8020/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      # NAS 冷启动 npm install 可能较慢，给足启动窗口
      start_period: 90s
    # 启动前自动执行 moelink 库的 knex 迁移（NAS 首次部署时库是空的）
    command: /bin/sh -c "npm install && npx knex migrate:latest && node app.js"

  # 真实股票数据 API + 抓取调度，独立于 node-api
  stock-worker:
    container_name: stock-worker
    image: node:22-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:8182:8182"
    environment:
      PORT: "8182"
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./repos/node-api:/app
      - stock_worker_node_modules_cache:/app/node_modules
    depends_on:
      node-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8182/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 90s
    command: /bin/sh -c "npm install && node worker/stock.js"

  maj-server:
    container_name: maj-server
    image: node:22-alpine
    working_dir: /app
    ports:
      - "8181:8181"
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./repos/node-api:/app
      # 独立的 node_modules 卷：与 node-api 并发 npm install 时互不干扰
      - maj_node_modules_cache:/app/node_modules
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ps -ef | grep '[n]ode service/majserver/server.js' >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 5s
    command: /bin/sh -c "npm install && node service/majserver/server.js"

  # Gateway: reverse proxy + per-API traffic stats + health monitoring/alerts
  moelink-gateway:
    container_name: moelink-gateway
    image: oven/bun:1.3.14-alpine
    working_dir: /app
    command: bun --watch src/server.js
    ports:
      - "8000:8000"
    environment:
      # 管理员 JWT 由 auth-service 签发，网关只通过 JWKS 获取公钥校验
      AUTH_JWKS_URL: http://auth-service:8081/auth/.well-known/jwks.json
      # 管理员 user_id 白名单；配置后即使 node-api 挂了也能登录后台
      GATEWAY_ADMIN_EMAILS: ${GATEWAY_ADMIN_EMAILS:-}
      NODE_API_URL: http://node-api:8020
      # 机器 token：Prometheus / 脚本访问 /metrics 用，不是网页登录密码
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      STATS_FILE: /data/stats.json
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./repos/moelink-gateway:/app
      - gateway_data:/data
      - ./repos:/repos:ro # release guardian 读取各仓库 HEAD
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/_gateway/health"]
      interval: 30s
      retries: 3
      timeout: 10s

  postgres:
    container_name: postgres
    image: postgres:16.4-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # 宿主机端口默认 5432；NAS 上被占用时在 .env 中设置 POSTGRES_HOST_PORT=5433；
      # 仅绑定本机回环：容器间通信用服务名 postgres:5432 不受影响，
      # 避免 NAS 上弱密码数据库暴露到局域网（需要外部访问时再改为 0.0.0.0）
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      # ⚠️ NAS 部署务必在 .env 中设置强密码
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: moelink
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
