version: '3.9'

volumes:
  postgres_data:
  go_mods:
  go_tools:
  go_bin:
  vite_deps:
  node_modules_cache:
  genshin_node_modules_cache:
  moelink_node_modules_cache:

services:
  # React with Vite and Bun
  genshinquiz-frontend:
    container_name: genshinquiz-frontend
    build:
      context: ./repos/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./repos/frontend:/app
      - genshin_node_modules_cache:/app/node_modules
      - vite_deps:/app/node_modules/.vite # 挂载 Vite 依赖缓存
    environment:
      VITE_API_URL: http://genshinquiz-backend:8080
      CHOKIDAR_USEPOLLING: true
    depends_on:
      genshinquiz-backend:
        condition: service_healthy
    command: /bin/sh -c "bun install && bun run dev:docker"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 30s
    restart: unless-stopped
    profiles: ["genshinquiz"]

  # Go Backend API
  genshinquiz-backend:
    container_name: genshinquiz-backend
    image: golang:1.26
    restart: unless-stopped
    ports:
      - "8080:8080"
    working_dir: /app
    environment:
      GOBIN: /app/bin
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/genshinquiz?sslmode=disable"
    volumes:
      - ./repos/backend:/app
      - go_mods:/go/pkg/mod
      - go_bin:/app/bin
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /usr/local/bin/task ]; then
          curl -sL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
        fi
        if ! command -v psql &> /dev/null; then
          apt update && apt install -y postgresql-client && apt clean
        fi
        task init-env
        if [ ! -f /app/bin/goose ]; then
          go install github.com/pressly/goose/v3/cmd/goose@latest
        fi
        task db-migration-up || (echo "Migration failed"; exit 1)
        task run-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 40s
    profiles: ["genshinquiz"]

  # Moelink Frontend
  moe-link:
    container_name: moe-link
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./repos/MoeLink:/app
      - moelink_node_modules_cache:/app/node_modules
      - ./repos/MoeLink/openapi:/app/openapi # 挂载 openapi 文件夹
    environment:
      VITE_API_URL: http://host.docker.internal:8020
      CHOKIDAR_USEPOLLING: true
    depends_on:
      - node-api
    command: /bin/sh -c "npm install && npm run dev"
    profiles: ["moelink"]

  # Node.js API Server
  node-api:
    container_name: node-api
    image: node:22-alpine
    working_dir: /app
    ports:
      - "8020:8020"
    volumes:
      - ./repos/node-api:/app
      - node_modules_cache:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8020/health"]
      interval: 30s
      retries: 3
      timeout: 10s
      start_period: 5s
    command: /bin/sh -c "npm install && node app.js"
    profiles: ["moelink"]

  postgres:
    container_name: postgres
    image: postgres:16.4-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moelink
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["genshinquiz", "moelink"]
